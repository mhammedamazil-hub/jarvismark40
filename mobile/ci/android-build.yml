name: Build JARVIS Mobile APK

# Builds the standalone Android agent and, on a version tag, attaches the APK to a
# GitHub Release so you can download + sideload it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7
        run: |
          curl -sSL -o "$HOME/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$HOME/gradle.zip" -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: mobile
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-debug
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mobile/app/build/outputs/apk/debug/*.apk
