name: Build JARVIS Mobile APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android cmdline-tools
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          for V in 15859902 13114759 13114758 11076708; do
            URL="https://dl.google.com/android/repository/commandlinetools-linux-${V}_latest.zip"
            echo "Trying $URL"
            if curl -fsSL --retry 3 --retry-delay 3 -o cmdtools.zip "$URL"; then
              echo "Downloaded from $URL"
              break
            fi
          done
          test -s cmdtools.zip
          unzip -q cmdtools.zip
          rm -rf latest && mv cmdline-tools latest
          rm cmdtools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK platform 34 + build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -sSLf --retry 3 --retry-delay 5 -o "$HOME/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$HOME/gradle.zip" -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: mobile
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-debug
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mobile/app/build/outputs/apk/debug/*.apk
